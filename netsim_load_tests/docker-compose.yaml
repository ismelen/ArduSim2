version: '3.8'

services:
  broker:
    build:
      context: ../../
      dockerfile: Dockerfile
    image: network_simulator:latest
    ports:
      - "3000:3000/udp"
      - "3001:3001/udp"
    networks:
      - sim_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  uav:
    build:
      context: .
      dockerfile: Dockerfile.uav
    image: uav_simulator:latest
    depends_on:
      - broker
    environment:
      - BROKER_IP=broker
      - BROKER_PORT=3000
      - EMIT_INTERVAL=0.2  # Emits 5 messages per second
    networks:
      - sim_net
    deploy:
      mode: replicated
      replicas: 1
    logging:
      driver: "none"

networks:
  sim_net:
    driver: bridge
